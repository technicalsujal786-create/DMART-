<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>D MART — Dildarnagar</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#e31b23;color:white;padding:14px 5%;position:sticky;top:0;z-index:20}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.logo{font-size:28px;font-weight:900;letter-spacing:1px}.search{flex:1;min-width:210px;padding:12px;border:0;border-radius:7px;font-size:16px}button{cursor:pointer}.cart{border:0;border-radius:7px;padding:12px 16px;font-weight:800;color:#e31b23}
.hero{background:white;padding:32px 5%}.hero h1{margin:0 0 8px;font-size:34px}.hero p{color:#666;margin:0;line-height:1.5}.wrap{padding:22px 5%}.info{background:white;border-radius:10px;padding:15px;margin-bottom:20px;border:1px solid #eee}.wa{float:right;color:#128c45;text-decoration:none;font-weight:800}
.cats{display:flex;gap:9px;overflow:auto;padding-bottom:10px;margin-bottom:18px}.cat{white-space:nowrap;border:1px solid #ddd;background:white;border-radius:20px;padding:10px 15px}.cat.active{background:#e31b23;color:white;border-color:#e31b23}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px}.card{background:white;border-radius:10px;padding:14px;box-shadow:0 1px 5px #ddd}.pic{height:115px;display:flex;align-items:center;justify-content:center;font-size:65px;background:#fafafa;border-radius:8px}.card h3{font-size:15px;min-height:38px;margin:10px 0 7px}.price{font-size:19px;font-weight:900}.old{font-size:13px;color:#999;text-decoration:line-through;margin-left:5px}.add{width:100%;margin-top:10px;padding:11px;border:0;border-radius:6px;background:#e31b23;color:white;font-weight:800}
.drawer{position:fixed;right:0;top:0;width:min(430px,100%);height:100%;background:white;z-index:30;padding:20px;box-shadow:-3px 0 12px #aaa;transform:translateX(100%);transition:.25s;overflow:auto}.drawer.open{transform:translateX(0)}.close{float:right;border:0;padding:8px;border-radius:5px}.item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.qty button{border:1px solid #ddd;background:white;padding:5px 9px}.checkout input,.checkout textarea,.checkout select{width:100%;padding:11px;margin:6px 0;border:1px solid #ccc;border-radius:6px}.place{width:100%;padding:13px;background:#e31b23;color:white;border:0;border-radius:6px;font-weight:900}.empty{text-align:center;color:#777;padding:25px}
footer{padding:30px;text-align:center;color:#777}
</style></head><body>
<header><div class="top"><div class="logo">D MART</div><input id="search" class="search" placeholder="Search grocery products..."><button class="cart" onclick="openCart()">🛒 Cart (<span id="count">0</span>)</button></div></header>
<section class="hero"><h1>Grocery shopping made easy</h1><p>Best daily essentials for Dildarnagar. Local delivery available within 10 km.</p></section>
<main class="wrap"><div class="info"><b>📍 Delivery:</b> Dildarnagar + 10 km &nbsp; | &nbsp; <b>📞 9044327675</b><a class="wa" href="https://wa.me/919044327675" target="_blank">💬 WhatsApp</a></div>
<div id="cats" class="cats"></div><div id="grid" class="grid"></div></main>
<footer>© 2026 D MART • Dildarnagar • Delivery within 10 km • 9044327675</footer>
<aside id="drawer" class="drawer"><button class="close" onclick="closeCart()">✕</button><h2>🛒 Your Cart</h2><div id="cartItems"></div><h3 id="total">Total: ₹0</h3>
<div class="checkout"><h3>Checkout</h3><input id="name" placeholder="Full name"><input id="phone" placeholder="Mobile number"><textarea id="address" rows="3" placeholder="Delivery address"></textarea>
<select id="payment"><option>Cash on Delivery</option><option>UPI / Online Payment</option></select>
<button class="place" onclick="placeOrder()">Place Order</button></div></aside>
<script>
const products=[["Aashirvaad Atta 5 kg", "Atta & Flour", 299, 349, "🌾"], ["India Gate Basmati Rice 5 kg", "Rice & Dal", 499, 579, "🍚"], ["Toor Dal 1 kg", "Rice & Dal", 139, 159, "🫘"], ["Moong Dal 1 kg", "Rice & Dal", 129, 149, "🫘"], ["Masoor Dal 1 kg", "Rice & Dal", 105, 125, "🫘"], ["Fortune Sunflower Oil 1 L", "Oil & Ghee", 129, 149, "🫗"], ["Sugar 5 kg", "Staples", 239, 270, "🍬"], ["Tata Salt 1 kg", "Staples", 25, 30, "🧂"], ["Tea 250 g", "Beverages", 125, 145, "🍵"], ["Coffee 100 g", "Beverages", 110, 130, "☕"], ["Milk 1 L", "Dairy", 65, 70, "🥛"], ["Curd 400 g", "Dairy", 45, 50, "🥛"], ["Bread", "Dairy", 40, 45, "🍞"], ["Biscuits Pack", "Snacks", 40, 50, "🍪"], ["Namkeen 200 g", "Snacks", 65, 75, "🥨"], ["Noodles Pack", "Snacks", 45, 55, "🍜"], ["Bath Soap Pack", "Personal Care", 120, 145, "🧼"], ["Shampoo 180 ml", "Personal Care", 155, 180, "🧴"], ["Toothpaste 200 g", "Personal Care", 110, 130, "🪥"], ["Detergent 2 kg", "Household", 210, 240, "🧺"], ["Dishwash Liquid", "Household", 99, 120, "🧽"], ["Floor Cleaner 1 L", "Household", 135, 160, "🧹"], ["Tomato 1 kg", "Fruits & Vegetables", 35, 45, "🍅"], ["Potato 1 kg", "Fruits & Vegetables", 30, 40, "🥔"], ["Onion 1 kg", "Fruits & Vegetables", 35, 45, "🧅"], ["Banana 1 dozen", "Fruits & Vegetables", 50, 60, "🍌"], ["Apple 1 kg", "Fruits & Vegetables", 140, 180, "🍎"], ["Cucumber 1 kg", "Fruits & Vegetables", 40, 50, "🥒"], ["Cold Drink 1.25 L", "Beverages", 70, 80, "🥤"], ["Mineral Water 1 L", "Beverages", 20, 20, "💧"]];
let cart=JSON.parse(localStorage.getItem("dmartCart")||"{}"),active="All";
const cats=["All",...new Set(products.map(p=>p[1]))];
function renderCats(){document.getElementById("cats").innerHTML=cats.map(c=>`<button class="cat ${c===active?"active":""}" onclick="active='${c}';render()">${c}</button>`).join("")}
function render(){renderCats();let q=document.getElementById("search").value.toLowerCase();let list=products.filter(p=>(active==="All"||p[1]===active)&&p[0].toLowerCase().includes(q));document.getElementById("grid").innerHTML=list.map(p=>`<div class="card"><div class="pic">${p[4]}</div><h3>${p[0]}</h3><div class="price">₹${p[2]} <span class="old">₹${p[3]}</span></div><button class="add" onclick="add(${products.indexOf(p)})">Add to Cart</button></div>`).join("")}
function save(){localStorage.setItem("dmartCart",JSON.stringify(cart))}
function add(i){cart[i]=(cart[i]||0)+1;save();renderCart()}
function change(i,d){cart[i]+=d;if(cart[i]<=0)delete cart[i];save();renderCart()}
function renderCart(){let keys=Object.keys(cart),total=0,count=0;let box=document.getElementById("cartItems");if(!keys.length)box.innerHTML='<div class="empty">Your cart is empty.</div>';else box.innerHTML=keys.map(k=>{let p=products[k],n=cart[k];total+=p[2]*n;count+=n;return `<div class="item"><div><b>${p[4]} ${p[0]}</b><br>₹${p[2]} × ${n}</div><div class="qty"><button onclick="change(${k},-1)">−</button> ${n} <button onclick="change(${k},1)">+</button></div></div>`}).join("");document.getElementById("total").textContent="Total: ₹"+total;document.getElementById("count").textContent=count}
function openCart(){document.getElementById("drawer").classList.add("open");renderCart()}function closeCart(){document.getElementById("drawer").classList.remove("open")}
function placeOrder(){let keys=Object.keys(cart),n=document.getElementById("name").value.trim(),ph=document.getElementById("phone").value.trim(),a=document.getElementById("address").value.trim();if(!keys.length)return alert("Cart is empty");if(!n||!ph||!a)return alert("Please enter name, mobile and address.");let id="DM"+Date.now().toString().slice(-8),lines=keys.map(k=>products[k][0]+" x "+cart[k]).join("\n");let msg=`New D MART Order %23${id}\nName: ${n}\nPhone: ${ph}\nAddress: ${a}\nPayment: ${document.getElementById("payment").value}\nItems:\n${lines}`;window.open("https://wa.me/919044327675?text="+encodeURIComponent(msg),"_blank");alert("Order ready! Order ID: "+id);cart={};save();renderCart();closeCart()}
document.getElementById("search").addEventListener("input",render);render();renderCart();
</script></body></html>
